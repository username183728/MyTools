name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Keep Buildozer/p4a downloads between runs. This is important because
      # a temporary HTTP 504 should not force the whole Android toolchain
      # to be downloaded again.
      - name: Cache Buildozer and Android toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libtinfo5 cmake \
            libffi-dev libssl-dev automake

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cython==0.29.36" buildozer

      - name: Build debug APK (automatic retry for transient downloads)
        shell: bash
        run: |
          set -u

          max_attempts=4
          for attempt in $(seq 1 "$max_attempts"); do
            echo "========================================"
            echo "Build attempt $attempt/$max_attempts"
            echo "========================================"

            if buildozer -v android debug; then
              echo "APK build succeeded."
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              wait_seconds=$((attempt * 20))
              echo "Build failed. Waiting ${wait_seconds}s before retry."
              echo "A retry is intentional because dependency downloads can"
              echo "temporarily return HTTP 504/Gateway Timeout."
              sleep "$wait_seconds"
            fi
          done

          echo "Build failed after ${max_attempts} attempts."
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTools-apk
          path: bin/*.apk
          if-no-files-found: error
